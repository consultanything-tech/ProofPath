<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>ProofPath synthetic shop</title></head><body><main><p class="label">Synthetic shop — no payment</p><p>Fixture revision: <span id="fixture-revision">baseline</span></p><h1>Desk Lamp</h1><p>S$39.00</p><button id="add">Add Desk Lamp</button><section aria-live="polite"><p>Cart quantity: <span id="cart-quantity">0</span></p><p>Total cents: <span id="cart-total-minor">0</span></p><p>Total: <span id="cart-total">S$0.00</span></p><label for="quantity">Quantity</label><input id="quantity" type="number" min="1" value="1"></section><button id="checkout">Checkout</button><section id="checkout-panel" hidden><p id="checkout-active">Checkout is active</p><label for="email">Email</label><input id="email" type="email" required aria-required="true" aria-describedby="email-error" aria-invalid="false"><p id="email-error" role="alert" hidden>Email is required.</p><label for="postal-code">Postal code</label><input id="postal-code" required aria-required="true" aria-describedby="postal-code-error" aria-invalid="false"><p id="postal-code-error" role="alert" hidden>Postal code is required.</p><button id="continue-checkout">Continue</button></section><script src="/shop.js"></script></main></body></html>
